components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - login
      - logout
      - login_failed
      - access
      - other
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
        * `login` - Login
        * `logout` - Logout
        * `login_failed` - Login Failed
        * `access` - Access
        * `other` - Other
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        domain:
          type: string
          format: uuid
        file:
          type: string
          format: uri
          writeOnly: true
        original_name:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
        description:
          type: string
          maxLength: 300
        linked_object_type:
          type: string
          maxLength: 100
        linked_object_id:
          type: string
          maxLength: 64
        uploaded_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - domain
      - file
      - id
      - original_name
      - sha256
      - size
      - uploaded_by
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        actor_id:
          type: string
          readOnly: true
        actor_email:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        object_type:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        object_repr:
          type: string
          readOnly: true
        domain_id:
          type: string
          readOnly: true
        changes:
          type: object
          additionalProperties: {}
          readOnly: true
        prev_hash:
          type: string
          readOnly: true
        hash:
          type: string
          readOnly: true
      required:
      - action
      - actor_email
      - actor_id
      - changes
      - domain_id
      - hash
      - id
      - ip_address
      - object_id
      - object_repr
      - object_type
      - prev_hash
      - timestamp
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    CustomFieldDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        object_type:
          type: string
          maxLength: 100
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          maxLength: 64
        label:
          type: string
          maxLength: 150
        help_text:
          type: string
          maxLength: 300
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        required:
          type: boolean
        choices:
          type: array
          items:
            type: string
        domain:
          type: string
          format: uuid
          nullable: true
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - field_type
      - id
      - key
      - label
      - object_type
      - updated_at
    Domain:
      type: object
      description: |-
        Validates the `custom_fields` payload against the definitions that apply to the object.

        Subclasses implement `custom_fields_domain(attrs)`, returning the Domain the object will
        live in, so the right scoped definitions are used.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        kind:
          $ref: '#/components/schemas/KindEnum'
        parent:
          type: string
          format: uuid
          nullable: true
        path:
          type: string
          readOnly: true
        depth:
          type: integer
          readOnly: true
        custom_fields:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - depth
      - id
      - name
      - path
      - updated_at
    FieldTypeEnum:
      enum:
      - text
      - number
      - boolean
      - date
      - choice
      - multi_choice
      type: string
      description: |-
        * `text` - Text
        * `number` - Number
        * `boolean` - Yes or no
        * `date` - Date
        * `choice` - Single choice
        * `multi_choice` - Multiple choice
    Grant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          type: string
          format: uuid
        role_name:
          type: string
          readOnly: true
        domain:
          type: string
          format: uuid
        domain_name:
          type: string
          readOnly: true
        recursive:
          type: boolean
      required:
      - domain
      - domain_name
      - id
      - role
      - role_name
    KindEnum:
      enum:
      - organisation
      - subsidiary
      - business_unit
      - entity
      - team
      - other
      type: string
      description: |-
        * `organisation` - Organisation
        * `subsidiary` - Subsidiary
        * `business_unit` - Business unit
        * `entity` - Entity
        * `team` - Team
        * `other` - Other
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    LoginResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        is_superuser:
          type: boolean
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        csrfToken:
          type: string
      required:
      - csrfToken
      - email
      - first_name
      - grants
      - id
      - is_superuser
      - last_name
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_superuser:
          type: boolean
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
          readOnly: true
      required:
      - email
      - grants
      - id
    ObjectType:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        actions:
          type: array
          items:
            type: string
        supports_custom_fields:
          type: boolean
      required:
      - actions
      - key
      - label
      - supports_custom_fields
